EVAL-process_path = 'process_connect.process.binary'
EVAL-process_args = 'process_connect.process.arguments'
EVAL-process_exec = replace('process_connect.process.binary', "^.*/", "")
EVAL-process_id = 'process_connect.process.pid'
EVAL-parent_process = 'process_connect.parent.binary'." ".'process_connect.parent.arguments'
EVAL-parent_process_name = replace('process_connect.parent.binary', "^.*/", "")
EVAL-parent_process_id = 'process_connect.parent.pid'
EVAL-container_image = 'process_connect.process.pod.container.image.name'
EVAL-container_id = 'process_connect.process.pod.container.id'
EVAL-src_ip = 'process_connect.source_ip'
EVAL-src_port = 'process_connect.source_port'
EVAL-dest_ip = 'process_connect.destination_ip'
EVAL-dest_port = 'process_connect.destination_port'
EVAL-transport = lower('process_connect.protocol')
EVAL-src_namespace = 'process_connect.process.pod.namespace'
EVAL-src_pod = 'process_connect.process.pod.name'
# Splunk Security Content (ESCU) Cisco Isovalent detections read these names
EVAL-pod_name = 'process_connect.process.pod.name'
EVAL-pod_namespace = 'process_connect.process.pod.namespace'
EVAL-pod_image_name = 'process_connect.process.pod.container.image.name'
EVAL-src_workload = 'process_connect.process.pod.namespace'."/".'process_connect.process.pod.workload'
EVAL-dest_namespace = 'process_connect.destination_pod.namespace'
EVAL-dest_pod = 'process_connect.destination_pod.name'
EVAL-dest_workload = 'process_connect.destination_pod.namespace'."/".'process_connect.destination_pod.workload'
EVAL-node = 'node_name'
EVAL-cluster = 'cluster_name'
EVAL-src = 'process_connect.source_ip'
EVAL-dest = 'process_connect.destination_ip'
EVAL-dvc = 'node_name'
EVAL-user = "uid:".'process_connect.process.uid'
EVAL-exec_id = 'process_connect.process.exec_id'
EVAL-cwd = 'process_connect.process.cwd'
EVAL-action = "allowed"
LOOKUP-zt_dest_protected = zt_protected_stores dest_workload OUTPUTNEW protected AS dest_protected, data_class AS dest_data_class, allowlist_policy AS allowlist_policy, mode AS allowlist_mode, owner AS dest_owner
LOOKUP-zt_src_owner = zt_workload_inventory workload AS src_workload OUTPUTNEW owner AS src_owner, team AS src_team, kind AS src_kind
LOOKUP-zt_process_approved = zt_process_allowlist src_workload, dest_workload, process OUTPUTNEW approved AS process_approved

[cisco:isovalent]
KV_MODE = json
TRUNCATE = 0
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = \},\s*"time":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%9NZ
MAX_TIMESTAMP_LOOKAHEAD = 40
category = Network & Security
description = Tetragon kprobe event (enforcement actions such as SIGKILL)
EVAL-process = 'process_kprobe.process.binary'
EVAL-process_name = replace('process_kprobe.process.binary', "^.*/", "")
EVAL-process_args = 'process_kprobe.process.arguments'
EVAL-parent_process = 'process_kprobe.parent.binary'." ".'process_kprobe.parent.arguments'
EVAL-src_namespace = 'process_kprobe.process.pod.namespace'
EVAL-src_pod = 'process_kprobe.process.pod.name'
EVAL-src_workload = 'process_kprobe.process.pod.namespace'."/".'process_kprobe.process.pod.workload'
EVAL-node = 'node_name'
EVAL-cluster = 'cluster_name'
EVAL-kprobe_action = 'process_kprobe.action'
EVAL-policy_name = 'process_kprobe.policy_name'
EVAL-dest = 'node_name'
EVAL-action = if('process_kprobe.action'=="KPROBE_ACTION_SIGKILL", "blocked", "allowed")
# A SIGKILL from a Tetragon policy is a runtime policy alert: Secure Networking Essentials counts events whose
# coalesce(event_sourcetype, sourcetype) is cisco:isovalent:alert (its Runtime Detections card)
EVAL-event_sourcetype = if('process_kprobe.action'=="KPROBE_ACTION_SIGKILL", "cisco:isovalent:alert", null())
