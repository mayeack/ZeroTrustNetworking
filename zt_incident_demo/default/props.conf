# All events are JSON sent over HTTP Event Collector with the event time in the envelope.
# The TIME_* settings are a fallback for raw ingestion of the same JSON.

[cilium:hubble:flow]
KV_MODE = json
TRUNCATE = 0
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = "time":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%9NZ
MAX_TIMESTAMP_LOOKAHEAD = 40
category = Network & Security
description = Cilium Hubble flow (exporter JSON) with both workload identities and the policy verdict
EVAL-verdict = 'flow.verdict'
EVAL-traffic_direction = 'flow.traffic_direction'
EVAL-direction = lower('flow.traffic_direction')
EVAL-src_ip = 'flow.IP.source'
EVAL-dest_ip = 'flow.IP.destination'
EVAL-src_port = coalesce('flow.l4.TCP.source_port', 'flow.l4.UDP.source_port')
EVAL-dest_port = coalesce('flow.l4.TCP.destination_port', 'flow.l4.UDP.destination_port')
EVAL-transport = if(isnotnull('flow.l4.UDP.destination_port'), "udp", "tcp")
EVAL-src_identity = 'flow.source.identity'
EVAL-dest_identity = 'flow.destination.identity'
EVAL-src_namespace = 'flow.source.namespace'
EVAL-src_pod = 'flow.source.pod_name'
EVAL-dest_namespace = 'flow.destination.namespace'
EVAL-dest_pod = 'flow.destination.pod_name'
EVAL-src_workload = if(isnotnull(mvindex('flow.source.workloads{}.name', 0)), 'flow.source.namespace'."/".mvindex('flow.source.workloads{}.name', 0), null())
EVAL-dest_workload = if(isnotnull(mvindex('flow.destination.workloads{}.name', 0)), 'flow.destination.namespace'."/".mvindex('flow.destination.workloads{}.name', 0), null())
EVAL-src_labels = 'flow.source.labels{}'
EVAL-dest_labels = 'flow.destination.labels{}'
EVAL-node = replace('node_name', "^[^/]+/", "")
EVAL-cluster = 'flow.source.cluster_name'
EVAL-policy_allowed = mvdedup(mvappend('flow.egress_allowed_by{}.name', 'flow.ingress_allowed_by{}.name'))
EVAL-policy_denied = mvdedup(mvappend('flow.egress_denied_by{}.name', 'flow.ingress_denied_by{}.name'))
EVAL-drop_reason = 'flow.drop_reason_desc'
EVAL-would_deny = if('flow.verdict'=="AUDIT", 1, 0)
EVAL-action = case('flow.verdict'=="DROPPED", "blocked", true(), "allowed")
EVAL-src = 'flow.IP.source'
EVAL-dest = 'flow.IP.destination'
EVAL-dvc = replace('node_name', "^[^/]+/", "")
EVAL-app = if(isnotnull(mvindex('flow.destination.workloads{}.name', 0)), mvindex('flow.destination.workloads{}.name', 0), "unknown")
EVAL-flow_uuid = 'flow.uuid'
LOOKUP-zt_dest_protected = zt_protected_stores dest_workload OUTPUTNEW protected AS dest_protected, data_class AS dest_data_class, allowlist_policy AS allowlist_policy, mode AS allowlist_mode, owner AS dest_owner
LOOKUP-zt_src_owner = zt_workload_inventory workload AS src_workload OUTPUTNEW owner AS src_owner, team AS src_team, kind AS src_kind

# ---------------------------------------------------------------------------------------------------------------
# Tetragon sourcetypes of the Cisco Security Cloud App (Isovalent Runtime Security). Keep this block when that app is
# installed: its props (4.1.2) add pod_name/pod_namespace/pod_image_name, dest, container_id and the connection IPs and
# ports, but not the zero trust fields and lookups below (src_workload, dest_workload, dest_protected, process_approved,
# owners), the SIGKILL alert tag, the PID as process_id or lowercase transport, and its processExec
# parent_process_name reads the process binary. Revisit when the dedicated Isovalent add-on ships.
[cisco:isovalent:processExec]
KV_MODE = json
TRUNCATE = 0
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = \},\s*"time":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%9NZ
MAX_TIMESTAMP_LOOKAHEAD = 40
category = Network & Security
description = Tetragon process execution event
EVAL-process = 'process_exec.process.binary'
EVAL-process_name = replace('process_exec.process.binary', "^.*/", "")
EVAL-process_path = 'process_exec.process.binary'
EVAL-process_args = 'process_exec.process.arguments'
EVAL-process_exec = replace('process_exec.process.binary', "^.*/", "")
EVAL-process_id = 'process_exec.process.pid'
EVAL-parent_process = 'process_exec.parent.binary'." ".'process_exec.parent.arguments'
EVAL-parent_process_name = replace('process_exec.parent.binary', "^.*/", "")
EVAL-parent_process_id = 'process_exec.parent.pid'
EVAL-container_image = 'process_exec.process.pod.container.image.name'
EVAL-container_id = 'process_exec.process.pod.container.id'
EVAL-src_namespace = 'process_exec.process.pod.namespace'
EVAL-src_pod = 'process_exec.process.pod.name'
# Splunk Security Content (ESCU) Cisco Isovalent detections read these names
EVAL-pod_name = 'process_exec.process.pod.name'
EVAL-pod_namespace = 'process_exec.process.pod.namespace'
EVAL-pod_image_name = 'process_exec.process.pod.container.image.name'
EVAL-src_workload = 'process_exec.process.pod.namespace'."/".'process_exec.process.pod.workload'
EVAL-node = 'node_name'
EVAL-cluster = 'cluster_name'
EVAL-dest = 'node_name'
EVAL-user = "uid:".'process_exec.process.uid'
EVAL-exec_id = 'process_exec.process.exec_id'
EVAL-cwd = 'process_exec.process.cwd'
LOOKUP-zt_src_owner = zt_workload_inventory workload AS src_workload OUTPUTNEW owner AS src_owner, team AS src_team, kind AS src_kind

