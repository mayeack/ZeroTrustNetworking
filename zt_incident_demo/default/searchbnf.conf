[ztdemo-command]
syntax = ztdemo action=(status|fire|reset|backfill|speed|config|tick) (value=<fast|normal>)? (hours=<int>)? (force=<bool>)? (agent_mode=<mcp|inline>)? (response_mode=<local|soar>)?
shortdesc = Control the zero trust incident: status, fire, reset, backfill, cadence and modes.
description = Generating command that returns one row describing what it did (or the state, for action=status).
usage = public
example1 = | ztdemo action=fire
comment1 = Start the incident now: the CI job, the program and the flow appear within seconds; attempts follow every 30 seconds.
example2 = | ztdemo action=reset
comment2 = Release the quarantine, cancel open requests and stamp the reset so the detections start a fresh window.

[ztbrief-command]
syntax = ztbrief
shortdesc = Parse agent responses into zt_agent_briefs and add the brief as a note on the ES investigation.
description = Streaming command fed with ai_agent:response events of ZTFlowInvestigator. Idempotent.
usage = public

[ztsoar-command]
syntax = ztsoar action=(request|approve|reject|verify|status) (request_id=<string>)? (comment=<string>)?
shortdesc = Local enforcement flow (Mode B): request, approve, reject and verify quarantines.
description = Approve and reject call the approvals REST endpoint with the caller's own session; the endpoint applies the decision with system privileges.
usage = public

[ztevidence-command]
syntax = ztevidence
shortdesc = Inline agent mode: pack the five evidence searches for the newest zero trust finding into one JSON field.
usage = public
