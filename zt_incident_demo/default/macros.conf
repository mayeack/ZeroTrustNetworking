[zt_index]
definition = index=zero_trust
description = The zero trust index

[zt_since_reset]
definition = [| makeresults | eval r=0 | append [| inputlookup zt_demo_state_lookup | fields last_reset_epoch | rename last_reset_epoch as r] | stats max(r) as r | eval earliest=max(relative_time(now(), "-60m@m"), r) | return earliest]
description = Detection window: the last 60 minutes, or since the last reset if that is later.

[zt_risk_window]
definition = | makeresults | eval r=0 | append [| inputlookup zt_demo_state_lookup | fields last_reset_epoch | rename last_reset_epoch as r] | stats max(r) as r | eval earliest=max(relative_time(now(), "-60m@m"), r), latest=now() | return earliest latest
description = Risk window for the finding-based detection: 60 minutes, or since the last reset if that is later.

[zt_last_reset]
definition = [| makeresults | eval r=0 | append [| inputlookup zt_demo_state_lookup | fields last_reset_epoch | rename last_reset_epoch as r] | stats max(r) as r | return r]
description = The epoch of the last reset (0 if never), for use inside eval.

[zt_not_already_risked(3)]
args = rule, object_field, threat_field
definition = search NOT [search index=risk source="$rule$" `zt_since_reset` | stats count by risk_object threat_object | rename risk_object as $object_field$, threat_object as $threat_field$ | fields $object_field$ $threat_field$ | append [| makeresults | eval $object_field$="-", $threat_field$="-" | fields - _time]]
description = Exclude object/threat pairs that this rule has already risked since the last reset.

[zt_incident_since_reset]
definition = index=zero_trust `zt_since_reset` (src_pod="ci-runner-7d9f8-xk2lq" OR pod="ci-runner-7d9f8-xk2lq" OR (sourcetype=ci:job:event build_id=88213) OR sourcetype=zt:enforcement:audit OR sourcetype=kube:apiserver:audit)
description = The incident's own events since the last reset.
