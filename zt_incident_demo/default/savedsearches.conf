[ZT Agent - Inline Triage]
description = Inline agent mode: for each new zero trust finding group without a brief, gather the five evidence searches into one JSON field and run the agent with it. Enabled by `| ztdemo action=config agent_mode=inline`.
search = | ztevidence | where isnotnull(evidence) | aiagent agent_name="ZTFlowInvestigator" prompt="Investigate this zero trust finding group and return the brief. Evidence: {evidence}"
