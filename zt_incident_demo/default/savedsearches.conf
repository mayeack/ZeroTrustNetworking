# Saved searches of the zero trust incident demo. Scheduled ones run every minute at fast cadence (| ztdemo action=speed).

[ZT Posture - Rollup]
description = Every minute (fast) or five minutes (normal): paths into protected stores by latest verdict, identities, audit-mode flows and enforcement actions over the last 24 hours, written to zt_summary.
search = index=zero_trust sourcetype=cilium:hubble:flow dest_protected=true (traffic_direction=INGRESS OR verdict=DROPPED) \
| stats latest(verdict) as verdict by src_workload dest_workload dest_port \
| eval enforced=if(verdict="AUDIT",0,1) \
| stats count as paths sum(enforced) as enforced \
| eval unprotected=paths-enforced, coverage_pct=round(100*enforced/paths,1) \
| appendcols [search index=zero_trust sourcetype=cilium:hubble:flow | eval id=mvappend(src_identity,dest_identity) | stats count by id | where id>=256 | stats dc(id) as identities] \
| appendcols [search index=zero_trust sourcetype=cilium:hubble:flow verdict=AUDIT | stats count as audit_flows_24h] \
| appendcols [search index=zero_trust sourcetype=zt:enforcement:audit state=applied | stats count as enforcement_24h count(eval(enforcement_point="kernel")) as enforcement_kernel count(eval(enforcement_point="dpu")) as enforcement_dpu count(eval(enforcement_point="switch")) as enforcement_switch] \
| fillnull value=0 identities audit_flows_24h enforcement_24h enforcement_kernel enforcement_dpu enforcement_switch \
| eval _time=now(), rollup="posture" \
| collect index=zt_summary source="ZT Posture - Rollup" marker="rollup=posture"
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = * * * * *
enableSched = 1
is_scheduled = 1
realtime_schedule = 0
schedule_window = 0
allow_skew = 0
disabled = 0
is_visible = 1

[ZT Lookup - Node Fabric]
description = Hourly: rebuild the node to switch port lookup from Nexus Dashboard endpoint snapshots.
search = index=zero_trust sourcetype=cisco:nexus:endpoint \
| stats latest(endpoint_ip) as node_ip latest(switch) as switch latest(interface) as interface latest(vrf) as vrf max(_time) as last_seen by node \
| eval fabric="dc2", last_seen=strftime(last_seen,"%Y-%m-%dT%H:%M:%SZ") \
| table node node_ip fabric switch interface vrf last_seen \
| outputlookup zt_node_fabric
dispatch.earliest_time = -2h
dispatch.latest_time = now
cron_schedule = 7 * * * *
enableSched = 1
is_scheduled = 1
realtime_schedule = 0
schedule_window = 0
allow_skew = 0
disabled = 0
is_visible = 1

[ZT Agent - Finding Context]
description = The newest zero trust finding group since the last reset for a workload (* for any): id, time, entity, risk, contributing detections, threat objects, MITRE IDs, pod, node and destination.
search = index=notable source="ZT - Workload Exceeded Risk Threshold on Protected-Path Signals - Rule" `zt_since_reset` normalized_risk_object="$workload$" \
| head 1 \
| eval finding_time=strftime(_time,"%Y-%m-%dT%H:%M:%SZ"), finding_id=event_id, mitre=mvjoin(mvdedup('annotations.mitre_attack.mitre_technique_id'),", "), contributing_detections=mvjoin(orig_source,"; "), threat_objects=mvjoin(threat_object,", ") \
| rename normalized_risk_object as entity, rule_title as title, status_label as status \
| join type=left entity [search index=risk source="ZT - *" `zt_since_reset` | stats values(src_pod) as pod values(node) as node values(dest_workload) as dest_workload values(dest_port) as dest_port values(process) as program sum(risk_score) as risk_from_intermediate by risk_object | rename risk_object as entity | eval pod=mvjoin(pod,","), node=mvjoin(node,","), dest_workload=mvjoin(dest_workload,","), program=mvjoin(program,",")] \
| table finding_id finding_time title entity risk_score source_count contributing_detections threat_objects mitre pod node dest_workload dest_port program status owner \
| head 20
dispatch.earliest_time = -24h
dispatch.latest_time = now
disabled = 0
is_visible = 1

[ZT Agent - Flow Evidence]
description = Hubble flows for one source workload (and destination, * for any) since the last reset: counts by verdict and direction, identities, labels, pods, observing node, policies, drop reason, and the store's allowlist and mode.
search = index=zero_trust sourcetype=cilium:hubble:flow src_workload="$workload$" dest_workload="$dest$" dest_protected=true `zt_since_reset` \
| stats count min(_time) as first_seen max(_time) as last_seen values(src_identity) as src_identity values(dest_identity) as dest_identity values(src_pod) as src_pod values(dest_pod) as dest_pod values(node) as observed_at_node values(policy_allowed) as allowed_by values(policy_denied) as denied_by values(drop_reason) as drop_reason values(allowlist_policy) as store_allowlist values(allowlist_mode) as allowlist_mode values(dest_data_class) as dest_data_class values(src_labels) as src_labels by src_workload dest_workload dest_port verdict traffic_direction \
| eval first_seen=strftime(first_seen,"%Y-%m-%dT%H:%M:%SZ"), last_seen=strftime(last_seen,"%Y-%m-%dT%H:%M:%SZ"), src_identity=mvjoin(src_identity,","), src_labels=mvjoin(src_labels," ") \
| sort - count \
| head 20
dispatch.earliest_time = -24h
dispatch.latest_time = now
disabled = 0
is_visible = 1

[ZT Agent - Process Evidence]
description = Tetragon connections from one pod to protected stores since the last reset: program, first and last arguments, parent chain, container image, destination, counts, and whether the program is approved for that store.
search = index=zero_trust sourcetype=cisco:isovalent:processConnect src_pod="$pod$" dest_protected=true `zt_since_reset` \
| stats count min(_time) as first_seen max(_time) as last_seen earliest(process_args) as first_arguments latest(process_args) as last_arguments values(parent_process) as parent_process values(container_image) as container_image values(node) as node values(src_workload) as src_workload values(dest_pod) as dest_pod values(process_approved) as process_approved values(user) as user values(cwd) as cwd by src_pod process dest_workload dest_port \
| eval approved_for_store=if(process_approved="true","yes","no"), first_seen=strftime(first_seen,"%Y-%m-%dT%H:%M:%SZ"), last_seen=strftime(last_seen,"%Y-%m-%dT%H:%M:%SZ") \
| fields - process_approved \
| sort - count \
| head 20
dispatch.earliest_time = -24h
dispatch.latest_time = now
disabled = 0
is_visible = 1

[ZT Agent - CI Job Context]
description = CI jobs that ran on one runner pod in the last 24 hours: project, pipeline, job id, name and stage, merge request, author, commit, script, status, failure reason and times. The job overlapping the incident is listed first.
search = index=zero_trust sourcetype=ci:job:event pod="$pod$" \
| stats latest(job_status) as status latest(failure_reason) as failure_reason latest(duration) as duration_s min(_time) as first_event max(_time) as last_event values(job_name) as job_name values(job_stage) as stage values(project) as project values(pipeline_id) as pipeline values(mr) as merge_request values(mr_title) as mr_title values(mr_url) as mr_url values(author) as author values(commit_short) as commit values(script) as script values(build_started_at) as started_at values(build_finished_at) as finished_at by job_id \
| eval key="global" | lookup zt_demo_state_lookup _key as key OUTPUT last_reset_epoch \
| eval since_reset=if(first_event>=coalesce(last_reset_epoch,0),1,0), merge_request=if(isnotnull(merge_request),"!".merge_request,null()), first_event=strftime(first_event,"%Y-%m-%dT%H:%M:%SZ"), last_event=strftime(last_event,"%Y-%m-%dT%H:%M:%SZ") \
| sort - since_reset - last_event \
| table job_id project pipeline job_name stage merge_request mr_title mr_url author commit script status failure_reason started_at finished_at duration_s since_reset \
| head 20
dispatch.earliest_time = -24h
dispatch.latest_time = now
disabled = 0
is_visible = 1

[ZT Agent - Workload and Server Context]
description = Owners and teams of a workload, the protected store it reached (owner, data class, allowlist members), the protected data behind the requested path, the server's switch port and Live Protect state, how many other workloads share that server, prior enforcement on the workload, a known-gap ticket if any, the approval matrix and the policy naming convention.
search = | inputlookup zt_workload_inventory where workload="$workload$" | eval context="workload", value="owner ".owner.", team ".team.", kind ".kind.", tier ".tier | table context value \
| append [search index=zero_trust sourcetype=cisco:isovalent:processConnect src_workload="$workload$" dest_protected=true `zt_since_reset` | stats values(dest_workload) as dest_workload values(dest_owner) as dest_owner values(dest_data_class) as dest_data_class values(allowlist_policy) as allowlist_policy values(allowlist_mode) as allowlist_mode by src_workload | eval context="protected store reached", value=mvjoin(dest_workload,",")." owner ".mvjoin(dest_owner,",")." data class ".mvjoin(dest_data_class,",")." allowlist ".mvjoin(allowlist_policy,",")." (".mvjoin(allowlist_mode,",")." mode)" | table context value] \
| append [search index=zero_trust sourcetype=cisco:isovalent:processConnect src_workload="$workload$" dest_protected=true `zt_since_reset` | stats count by dest_workload | lookup zt_store_allowlist dest_workload OUTPUT src_workload as members | eval context="allowlist members of ".dest_workload, value=mvjoin(members,", ") | table context value] \
| append [search index=zero_trust sourcetype=cisco:isovalent:processConnect src_workload="$workload$" dest_protected=true `zt_since_reset` | rex field=process_args "(?<url>https?://\S+)" | rex field=url "svc:\d+(?<request_path>/[^?\s]*)" | stats count by dest_workload request_path | eval path_prefix=replace(request_path,"^(/[^/]+/[^/]+/).*","\1") | lookup zt_protected_data dest_workload path_prefix OUTPUT dataset training_job_id job_name scheduler gpus owner | eval context="protected data requested", value=request_path." = ".coalesce(dataset,"unclassified data").if(isnotnull(training_job_id)," (training job ".training_job_id." ".job_name.", ".scheduler.", ".gpus." GPUs, owner ".owner.")","") | table context value] \
| append [| inputlookup zt_node_fabric where node="$node$" | eval context="server ".node, value="node ip ".node_ip.", ".switch." ".interface." vrf ".vrf | table context value] \
| append [| inputlookup zt_node_fabric where node="$node$" | head 1 | table node switch | join type=left switch [search index=zero_trust sourcetype=cisco:nexus:liveprotect | stats latest(status) as status latest(shield) as shield latest(advisory_id) as advisory by switch] | eval context="live protect on ".switch, value=coalesce(status,"unknown")." (shield ".coalesce(shield,"-").", advisory ".coalesce(advisory,"-").")" | table context value] \
| append [search index=zero_trust sourcetype=cilium:hubble:flow node="$node$" src_workload=* | stats dc(src_workload) as workloads_on_node values(src_workload) as list | eval context="other workloads on the server (blast radius of a switch-port action)", value=(workloads_on_node-1)." other workloads, e.g. ".mvjoin(mvindex(list,0,5),", ") | table context value] \
| append [search index=zero_trust sourcetype=zt:enforcement:audit workload="$workload$" earliest=-30d state=applied | stats count as actions latest(action) as last_action latest(_time) as last_time | eval context="prior enforcement on the workload (30 days)", value=if(actions>0, actions." action(s), last: ".last_action." at ".strftime(last_time,"%Y-%m-%dT%H:%M:%SZ"), "none") | table context value] \
| append [| inputlookup zt_known_gaps where src_workload="$workload$" | eval context="known gap ticket", value=ticket." (".dest_workload.":".dest_port.", owner ".owner.", ".status.")" | table context value] \
| append [| inputlookup zt_approvers | eval context="approval matrix: ".enforcement_point, value=approver_labels." (".approvals_required." approval(s))" | table context value] \
| append [| makeresults | eval context="quarantine policy naming", value="zt-quarantine-<workload>-<job id>; the pod label zt-quarantine carries the job id" | table context value] \
| head 20
dispatch.earliest_time = -24h
dispatch.latest_time = now
disabled = 0
is_visible = 1

[ZT Agent - Capture Brief]
description = Every minute: parse ZTFlowInvestigator responses, store the brief in zt_agent_briefs and add it as a note on the ES investigation. Idempotent.
search = index=_audit sourcetype=ai_agent:response agent_name=ZTFlowInvestigator type=run_finished `zt_since_reset` | localop | ztbrief
