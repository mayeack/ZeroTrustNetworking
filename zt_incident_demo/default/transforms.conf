# CSV lookups (built from the estate model)
[zt_workload_inventory]
filename = zt_workload_inventory.csv

[zt_protected_stores]
filename = zt_protected_stores.csv

[zt_store_allowlist]
filename = zt_store_allowlist.csv

[zt_process_allowlist]
filename = zt_process_allowlist.csv

[zt_known_gaps]
filename = zt_known_gaps.csv

[zt_protected_data]
filename = zt_protected_data.csv
match_type = WILDCARD(path_prefix)

[zt_node_fabric]
filename = zt_node_fabric.csv

[zt_approvers]
filename = zt_approvers.csv

[zt_role_labels]
filename = zt_role_labels.csv

# KV store collections
[zt_demo_state_lookup]
external_type = kvstore
collection = zt_demo_state
fields_list = _key, stream_checkpoint, backfill_done, last_reset_epoch, speed, response_mode, agent_mode, plan_t0, plan_attempt, plan_status, plan_dropped_attempts, plan_fail_at, plan_completed_epoch, last_fire_epoch, last_tick_epoch, last_tick_events, last_error

[zt_policy_state_lookup]
external_type = kvstore
collection = zt_policy_state
fields_list = _key, kind, namespace, name, spec_json, selector_json, labels_json, label_epochs_json, created_by, created_epoch, resource_version, uid

[zt_agent_briefs_lookup]
external_type = kvstore
collection = zt_agent_briefs
fields_list = _key, finding_id, finding_display_id, investigation_id, investigation_guid, workload, pod, node, job_id, what_happened, dest_workload, data_class, disposition, confidence, enforcement_point, action, policy_name, blast_radius, approver_labels, brief_json, brief_text, session_id, run_epoch, note_added

[zt_enforcement_requests_lookup]
external_type = kvstore
collection = zt_enforcement_requests
fields_list = _key, request_id, finding_id, investigation_id, investigation_guid, workload, pod, job_id, enforcement_point, action, policy_name, policy_yaml, label_patch_json, cnp_json, approvals_required, approver_roles, approver_labels, approvals, status, dest_workload, data_class, disposition, confidence, what_happened, blast_radius, requested_epoch, approved_epoch, applied_epoch, verified_epoch, k8s_audit_ids, comment, last_error
