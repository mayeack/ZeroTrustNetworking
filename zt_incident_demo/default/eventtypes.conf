[zt_flow]
search = index=zero_trust sourcetype=cilium:hubble:flow
description = Hubble flows

[zt_process]
search = index=zero_trust sourcetype=cisco:isovalent:processExec OR sourcetype=cisco:isovalent:processConnect OR sourcetype=cisco:isovalent
description = Tetragon process, connect and kprobe events

[zt_ci]
search = index=zero_trust sourcetype=ci:job:event
description = CI job events

[zt_fabric]
search = index=zero_trust sourcetype=cisco:nexus:endpoint OR sourcetype=cisco:nexus:liveprotect OR sourcetype=cisco:nexus:config
description = Nexus fabric data

[zt_enforcement]
search = index=zero_trust sourcetype=zt:enforcement:audit OR sourcetype=kube:apiserver:audit OR (sourcetype=cisco:nexus:config change_type=config)
description = Enforcement and change records
