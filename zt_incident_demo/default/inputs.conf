# The generator: every 15 seconds it emits the background events due since its checkpoint and advances the incident plan.
# It prints nothing to stdout; events go to HTTP Event Collector, logs to var/log/splunk/zt_incident_demo.log.
[script://$SPLUNK_HOME/etc/apps/zt_incident_demo/bin/zt_stream.py]
interval = 15
passAuth = splunk-system-user
python.version = python3
python.required = 3.9, 3.13
sourcetype = zt:stream
index = main
disabled = 0
