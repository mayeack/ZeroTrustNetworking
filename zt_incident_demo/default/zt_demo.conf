[hec]
# Set url to this stack's HTTP Event Collector endpoint (Splunk Cloud: https://http-inputs-<stack>.splunkcloud.com:443). `make configure` writes local/zt_demo.conf.
url = https://127.0.0.1:8088
verify_tls = 0
token_name = zt_incident_demo

[emulator]
# Where the Kubernetes API emulator answers (public hostname when it runs outside this Splunk instance).
url = https://127.0.0.1:6443
verify_tls = 1

[stream]
day_shape_tz = America/New_York
backfill_hours = 24
chunk_minutes = 30

[modes]
speed = fast
response_mode = local
agent_mode = mcp
