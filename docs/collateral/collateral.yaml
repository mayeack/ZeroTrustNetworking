deck:
  text_replacements:
    - slide: 14
      match: "Detections run every 5 minutes; the finding opens at 14:55"
      replace: "Detections run every minute in the live demo; the finding opens two to three minutes after the fire"
    - slide: 16
      match: "1  Start from the finding | ES investigation ES-1842"
      replace: "1  Start from the finding | ES finding group, investigation opened from it"
  notes:
    12: "Section two: switch to the demo. In Search, run | ztdemo action=fire and follow steps two to five live. Fast cadence: every scheduled search runs each minute, so the finding opens two to three minutes after the fire, the brief a minute or two later, and verification twenty to ninety seconds after the approval."
    13: "Live. Fire the incident from Search with | ztdemo action=fire, then show the two events. Hubble: index=zero_trust sourcetype=cilium:hubble:flow verdict=AUDIT src_workload=\"build-farm/ci-runner\". Tetragon: index=zero_trust sourcetype=cisco:isovalent:processConnect process_name=curl. Point at the same pod, the same destination and the same second, then at the context Splunk adds: owner platform-build, CI job 88213 from merge request !4417 by contractor-dev-17, server bf-node-03 on dc2-leaf-205 Eth1/12. The events arrive over the HTTP Event Collector of the Splunk Cloud stack exactly as production data would."
    14: "Live, in Enterprise Security 8.7. Two detections run every minute at fast cadence. The first, on Hubble flows, adds risk 50 to the runner workload for an audit-mode flow into a protected AI data store (MITRE ATT&CK T1530). The second, on Tetragon events, adds risk 40 for a program not on the approved list (T1059.004). The finding-based detection opens one finding group when the total reaches 80 from two detections: risk 90, threat objects ai-train/checkpoint-store and /usr/bin/curl, three drilldowns, and the Run AI Agent action. Show the Analyst Queue, open the finding, walk the risk timeline and the drilldowns."
    15: "Live, in the AI Toolkit's Agent Launchpad. The agent ZTFlowInvestigator is started by the Run AI Agent action on the finding-based detection; you can also run it from Search with the aiagent command. It only has the five zero trust tools exposed through the Splunk MCP Server on this stack: finding context, flow evidence, process evidence, CI job context, workload and server context. Open Agent run history, show the tool calls in order, then the brief: disposition, what happened, why it matters, where, recommendation, follow-up. The same brief is a note on the investigation."
    16: "Live, in SOAR (Mode A) or in the app's Enforcement Approvals page (Mode B). The playbook zt_quarantine_workload starts from the finding through an Enterprise Security automation rule, reads the brief, picks the nearest enforcement point, the kernel, builds the CiliumNetworkPolicy zt-quarantine-ci-runner-88213 and asks SOC tier 2. Approve as j.chen in a private window: the pod is labeled and the policy created through the Kubernetes API (an emulated endpoint reached through a tunnel, the same call as production), both recorded in the Kubernetes audit log with the approver on the audit trail."
    17: "Live: open the Zero Trust Fabric Posture dashboard in the app. Coverage of paths into protected stores went from 87.7% before the incident to 86.4% when the runner's path appeared, and to 87.9% after the quarantine; unprotected paths 8 to 9 to 8; workload identities 1,283 to 1,284 because the quarantine label creates a new Cilium identity; enforcement actions 16 to 17. The verdict chart shows AUDIT then DROPPED for the runner's attempts, and the first row of the audit trail is this incident: j.chen (SOC tier 2), verified. Then open the Incident Timeline: the five steps with their live timestamps, the journey grid from the one-pager, and every event of the incident."
  picture_replacements:
    - slide: 17
      shape_prefix: "Dashboard: Zero Trust Fabric"
      screenshot: posture
talk_track:
  section3_rows:          # column "Today" for each Item row of the table in section 3
    Deck: "Zero Trust Networking - First-Call Deck (One Incident, End to End), 20 slides, account-neutral. Slides 13 to 17 carry the live steps; speaker notes carry the click path at fast cadence."
    Dashboards: "Built in the Splunk Cloud stack (app Zero Trust Incident): Zero Trust Fabric Posture, Incident Timeline (five step cards and the one-pager's journey grid), Enforcement Approvals. Every row drills down to the raw event."
    Live demo instance: "Splunk Cloud stack prd-shw-39d7bab80b2f9d (Enterprise Security 8.7, AI Toolkit 6.1 Agent Launchpad, Splunk MCP Server 2.0) paired with SOAR Cloud. Flows, process events, CI jobs, switch data and the audit trail arrive over the HTTP Event Collector into the zero_trust index; the incident is fired from Search with | ztdemo action=fire."
    Enforcement: "SOAR playbook zt_quarantine_workload with an approval prompt to SOC tier 2 (Mode A), or the app's Enforcement Approvals page (Mode B). Both label the pod and create the CiliumNetworkPolicy through the Kubernetes API; in this build that endpoint is emulated and reached through a tunnel, so the call is the one production makes."
    Leave-behinds: "Customer leave-behind PDF; internal co-sell one-pager; the one-incident one-pager. Add the lab-phase scope document."
  beats:
    - title: "Beat 5: Live: fire the incident, Step 2 in Splunk"
      who: "Who:  Splunk SE   ·   Time: 4 min   ·   Screen: Slides 12 and 13, then Search in the app"
      say: "Say: Here is one connection, end to end. A contractor's merge request added a post-build script to a training repository; the CI job that runs it uses curl to copy checkpoint files from the protected store. Nothing was hacked: the runner had reach it should not have, and the store's allowlist is still in audit mode. I fire it now. Within seconds two events land in the zero_trust index: Hubble records the flow as AUDIT, would deny, with both workload identities; Tetragon names the program, curl, and its parent, the post-build script. Same pod, same destination, same second. And Splunk already adds the context: the owner, the CI job and merge request, the server and its switch port."
      show:
        - "Search: | ztdemo action=fire. Then the two searches from slide 13: index=zero_trust sourcetype=cilium:hubble:flow verdict=AUDIT src_workload=\"build-farm/ci-runner\" and index=zero_trust sourcetype=cisco:isovalent:processConnect process_name=curl."
        - "Open one event of each and point at pod ci-runner-7d9f8-xk2lq, identities 48213 and 30719, destination checkpoint-store-1 on 9000, and the timestamps 29 milliseconds apart."
        - "Fields on the left: src_owner platform-build, dest_data_class crown-jewel, allowlist_policy in audit mode; the CI job 88213 from merge request !4417 by contractor-dev-17 on bf-node-03."
      point:
        - "Identity, not IP: the flow carries both workload identities and the policy verdict."
        - "Seen at the source: the program behind the connection, with no sidecar and no agent per application."
    - title: "Beat 6: Live: Step 3, two signals, one finding, one brief"
      who: "Who:  Splunk SE   ·   Time: 4 min   ·   Screen: Slides 14 and 15, Enterprise Security Analyst Queue, AI Toolkit Agent run history"
      say: "Say: Two detections turn those events into risk on the workload: fifty for the audit-mode flow into a protected store, forty for a program that is not approved for it. When the total crosses eighty from two sources, one finding group opens: risk ninety, threat objects the checkpoint store and curl, the MITRE techniques, and drilldowns to the raw flows, the process events and the CI job. The finding starts an agent. It can only use five approved evidence tools through the Splunk MCP Server, it keeps the data in Splunk, and it recommends; a person decides. Here is its brief: true positive, quarantine the pod at the kernel, approver SOC tier 2, and three follow-ups."
      show:
        - "Analyst Queue: the finding group titled Unprotected path: build-farm/ci-runner reached a protected AI data store; open it, show risk 90 from two intermediate findings, the threat objects and the three drilldowns."
        - "AI Toolkit: Agent run history for ZTFlowInvestigator; open the run, show the five tool calls in order, then the structured brief."
        - "Back on the investigation: the same brief as a note, marked AI-generated."
      point:
        - "Evidence joined: workload, CI job, server and switch port are already correlated before anyone opens a ticket."
        - "The agent never acts; every statement cites a tool result."
    - title: "Beat 7: Live: Steps 4 and 5, approve, enforce, prove"
      who: "Who:  Splunk SE   ·   Time: 4 min   ·   Screen: Slides 16 and 17, SOAR prompt (Mode A) or Enforcement Approvals (Mode B), Incident Timeline, Zero Trust Fabric Posture"
      say: "Say: The playbook starts from the finding, reads the brief, picks the nearest enforcement point and builds the policy; then it asks a named person. I approve as j.chen, SOC tier 2, in the other window. Two seconds later the pod is labeled and the CiliumNetworkPolicy exists, both recorded by the Kubernetes API audit log. The runner's next attempt is DROPPED by that policy, with a new identity because the label changed. The playbook confirms it in Splunk, writes the audit trail and resolves the investigation. And the posture dashboard proves it: coverage up, one fewer unprotected path, one more enforcement action, with the approver on record."
      show:
        - "Approve: read the policy YAML in the prompt, approve with a comment. Then the Incident Timeline: the five step cards fill in, the journey grid checks every cell, the raw events appear at the bottom."
        - "Zero Trust Fabric Posture: coverage 87.9% up from 86.4%, unprotected paths 8 down from 9, identities 1,284, enforcement actions 17; the verdict chart flips from AUDIT to DROPPED; the first audit trail row is j.chen (SOC tier 2), verified."
        - "After the call: | ztdemo action=reset releases the quarantine and stamps the reset so the next fire starts clean."
      point:
        - "Contained in minutes at the narrowest point, with a named approver."
        - "Proof, not assumption: the same data that raised the finding shows the new verdict."
  section7_rows:          # appended to the facts table (Claim / Status and source) if not present
    - ["Enterprise Security 8.7 on the Splunk Cloud stack starts SOAR playbooks through automation rules", "Verified on the stack (missioncontrol 6.7): rules trigger on finding_created for a named detection; label activation is not used."]
    - ["Agent Launchpad (AI Toolkit 6.1) runs agents in Splunk Cloud Services and reaches the Splunk MCP Server 2.0 on the stack", "Verified: MCP endpoint https://<stack>:8089/services/mcp, bearer token per user, tools restricted by role."]
    - ["ES and SOAR Cloud are paired", "Verified: pairing_status Pairing Success; findings arrive in SOAR with the label es_soar_integration."]
