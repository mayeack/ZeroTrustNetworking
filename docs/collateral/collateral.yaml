talk_track:
  section3_rows:
    Deck: Zero Trust Networking - First-Call Deck (One Incident, End to End), 22 slides, account-neutral, the master deck. Slide 3 plays back the three initiatives, slide 13 is what ships and what we build,
      slides 15 to 19 carry the live steps; speaker notes carry the click path at fast cadence. The original 17-slide First-Call Deck is the longer version for other audiences.
    Dashboards: 'Built in the Splunk Cloud stack (app Zero Trust Incident): a home page with one card per dashboard and live numbers, Zero Trust Fabric Posture, Incident Timeline (an incident selector,
      five step cards and the one-pager''s journey grid), Enforcement Approvals. Every row drills down to the raw event.'
    Live demo instance: Splunk Cloud stack prd-shw-39d7bab80b2f9d (Enterprise Security 8.7, AI Toolkit 6.1 Agent Launchpad, Splunk MCP Server 2.0) paired with SOAR Cloud. Flows, process events, CI jobs,
      switch data and the audit trail arrive over the HTTP Event Collector into the zero_trust index; the incident is fired from the live generator page on the presenter Mac (a browser app that streams
      the data and shows every event as it leaves, with triggers for single events) or from Search with | ztdemo action=fire.
    Secure Networking Essentials: 'Splunk Secure Networking Essentials (Beta; app splunk-cisco-dashboards 1.0.52) on the same stack. Setup completed 24 September 2026 with the Searchbase app 1.1.8: only
      index_security changed (to zero_trust); the CIM allowlists are untouched. Show Secure Infrastructure › Secure Data Center Operations, 24h: Runtime Security (87 nodes, 129 namespaces, about 12,000
      process executions, telemetry age 0) and Runtime Investigation (build-farm / ci-runner tops the workloads). Stay off Fabric Operations and Data Center Security: without the Cisco DC Networking app
      they show no data or data-model errors.'
    Enforcement: 'SOAR playbook zt_quarantine_workload with an approval prompt to SOC tier 2 (Mode A), or the app''s Enforcement Approvals page (Mode B). Both label the pod and create the CiliumNetworkPolicy
      through the Kubernetes API; in this build that endpoint is emulated and reached through a tunnel, so the call is the one production makes. SOAR uses its HTTP app, the supported path: there is no packaged
      Kubernetes connector.'
    Leave-behinds: Customer leave-behind PDF; internal co-sell one-pager; the one-incident one-pager. Their HTML sources are in the demo repo under docs/collateral/pdf (render_pdfs.py prints them). Add
      the lab-phase scope document.
  beats:
  - title: 'Beat 5: Out of the box first: what ships'
    who: 'Who:  Splunk SE   ·   Time: 2 min   ·   Screen: Slide 13, then Splunk Secure Networking Essentials'
    say: 'Say: Before I show you what we built, here is what ships. Most of this loop is product: Splunk Secure Networking Essentials, in beta, already reads your Tetragon data; Splunk Security Content
      ships ten Cisco Isovalent detections; Enterprise Security, Agent Launchpad and SOAR do the rest. What we build with you is small and specific to you: which stores are protected, who may reach them,
      two detections on those paths, five evidence searches for the agent, and the playbook. Here is the product view: every node and namespace Tetragon sees, the process executions, and how fresh the telemetry
      is. Notice the busiest workload: the build farm''s CI runner. Hold that thought.'
    show:
    - 'Slide 13: the left side is product, the right side is built for you.'
    - 'Splunk Web: Splunk Secure Networking Essentials › Secure Infrastructure › Secure Data Center Operations, time range 24h, tab Runtime Security: Active Isovalent Nodes 87, Observed Namespaces 129,
      Process Executions Observed about 12,000, Telemetry Age 0 minutes.'
    - 'Tab Runtime Investigation: Top workloads by process execution volume, with build-farm / ci-runner first.'
    point:
    - The day-to-day view needs no custom dashboard; the custom part is your policy and the loop.
    - 'Runtime Detections reads 0 because this lab sends no Tetragon policy alerts; the detections in this story run in Enterprise Security. Stay off the Fabric Operations and Data Center Security tabs:
      without the Cisco DC Networking app they show no data.'
    - Say beta; give no availability date.
  - title: 'Beat 6: Live: fire the incident, Step 2 in Splunk'
    who: 'Who:  Splunk SE   ·   Time: 4 min   ·   Screen: Slides 14 and 15, then Search in the app'
    say: 'Say: Here is one connection, end to end. A contractor''s merge request added a post-build script to a training repository; the CI job that runs it uses curl to copy checkpoint files from the protected
      store. Nothing was hacked: the runner had reach it should not have, and the store''s allowlist is still in audit mode. I fire it now. Within seconds two events land in the zero_trust index: Hubble
      records the flow as AUDIT, would deny, with both workload identities; Tetragon names the program, curl, and its parent, the post-build script. Same pod, same destination, same second. And Splunk already
      adds the context: the owner, the CI job and merge request, the server and its switch port.'
    show:
    - 'Live generator page: Fire the incident (or Search: | ztdemo action=fire). Then the two searches from slide 15: index=zero_trust sourcetype=cilium:hubble:flow verdict=AUDIT src_workload="build-farm/ci-runner"
      and index=zero_trust sourcetype=cisco:isovalent:processConnect process_name=curl.'
    - Open one event of each and point at pod ci-runner-7d9f8-xk2lq, identities 48213 and 30719, destination checkpoint-store-1 on 9000, and the timestamps 29 milliseconds apart.
    - 'Fields on the left: src_owner platform-build, dest_data_class crown-jewel, allowlist_policy in audit mode; the CI job 88213 from merge request !4417 by contractor-dev-17 on bf-node-03.'
    point:
    - 'Identity, not IP: the flow carries both workload identities and the policy verdict.'
    - 'Seen at the source: the program behind the connection, with no sidecar and no agent per application.'
  - title: 'Beat 7: Live: Step 3, two signals, one finding, one brief'
    who: 'Who:  Splunk SE   ·   Time: 4 min   ·   Screen: Slides 16 and 17, Enterprise Security Analyst Queue, AI Toolkit Agent run history'
    say: 'Say: Two detections turn those events into risk on the workload: fifty for the audit-mode flow into a protected store, forty for a program that is not approved for it. When the total crosses eighty
      from two sources, one finding group opens: risk ninety, threat objects the checkpoint store and curl, the MITRE techniques, and drilldowns to the raw flows, the process events and the CI job. The
      finding starts an agent. It can only use five approved evidence tools through the Splunk MCP Server, it keeps the data in Splunk, and it recommends; a person decides. Here is its brief: true positive,
      quarantine the pod at the kernel, approver SOC tier 2, and three follow-ups.'
    show:
    - 'Analyst Queue: the finding group titled Unprotected path: build-farm/ci-runner reached a protected AI data store; open it, show risk 90 from two intermediate findings, the threat objects and the
      three drilldowns.'
    - 'AI Toolkit: Agent run history for ZTFlowInvestigator; open the run, show the five tool calls in order, then the structured brief.'
    - 'Back on the investigation: the same brief as a note, marked AI-generated.'
    point:
    - 'Evidence joined: workload, CI job, server and switch port are already correlated before anyone opens a ticket.'
    - The agent never acts; every statement cites a tool result.
  - title: 'Beat 8: Live: Steps 4 and 5, approve, enforce, prove'
    who: 'Who:  Splunk SE   ·   Time: 4 min   ·   Screen: Slides 18 and 19, SOAR prompt (Mode A) or Enforcement Approvals (Mode B), Incident Timeline, Zero Trust Fabric Posture'
    say: 'Say: The playbook starts from the finding, reads the brief, picks the nearest enforcement point and builds the policy; then it asks a named person. I approve as j.chen, SOC tier 2, in the other
      window. Two seconds later the pod is labeled and the CiliumNetworkPolicy exists, both recorded by the Kubernetes API audit log. The runner''s next attempt is DROPPED by that policy, with a new identity
      because the label changed. The playbook confirms it in Splunk, writes the audit trail and resolves the investigation. And the posture dashboard proves it: coverage up, one fewer unprotected path,
      one more enforcement action, with the approver on record.'
    show:
    - 'Approve: read the policy YAML in the prompt, approve with a comment. Then the Incident Timeline: the five step cards fill in, the journey grid checks every cell, the raw events appear at the bottom.'
    - 'Zero Trust Fabric Posture: coverage 87.9% up from 86.4%, unprotected paths 8 down from 9, identities 1,284, enforcement actions 17; the verdict chart flips from AUDIT to DROPPED; the first audit
      trail row is j.chen (SOC tier 2), verified.'
    - 'After the call: | ztdemo action=reset releases the quarantine and stamps the reset so the next fire starts clean.'
    point:
    - Contained in minutes at the narrowest point, with a named approver.
    - 'Proof, not assumption: the same data that raised the finding shows the new verdict.'
  section7_rows:
  - - Enterprise Security 8.7 on the Splunk Cloud stack starts SOAR playbooks through automation rules
    - 'Verified on the stack (missioncontrol 6.7): rules trigger on finding_created for a named detection; label activation is not used.'
  - - Agent Launchpad (AI Toolkit 6.1) runs agents in Splunk Cloud Services and reaches the Splunk MCP Server 2.0 on the stack
    - 'Verified: MCP endpoint https://<stack>:8089/services/mcp, bearer token per user, tools restricted by role.'
  - - ES and SOAR Cloud are paired
    - 'Verified: pairing_status Pairing Success; findings arrive in SOAR with the label es_soar_integration.'
  - - 'Splunk Security Content: Cisco Isovalent detections'
    - 'Ten detections, analytic story Cisco Isovalent Suspicious Activity (ESCU 5.20, 20 January 2026; updated 13 May 2026; ESCU is at 6.7.0 and the stack runs 6.5.0 with them disabled). All anomaly type,
      risk 20 on pod_name: shell execution, curl with insecure flags, cloud metadata access, cron job creation, late process execution, non-allowlisted image, nsenter, offensive tools, escape to host; plus
      a kprobe-spike hunting search. They expect pod_name, pod_namespace and pod_image_name; this build emits src_pod, src_namespace and container_image, so they need field aliases before they fire here.'
  - - Splunk Secure Networking Essentials (Beta)
    - 'Splunkbase 9257, 1.0.52 (22 September 2026), Splunk Field Solutions; invitation-only beta, general availability targeted for fall 2026 (internal only: say beta, no date). Collects no data; reads
      the Cisco add-ons. Its Secure Data Center Operations dashboard has a Cisco Isovalent runtime section that reads Tetragon JSON directly; setup needs the Searchbase app (7188). Verified on the stack
      24 September 2026: 87 nodes, 129 namespaces, 12,289 process executions in 24 hours.'
  - - Cisco Enterprise Networking app and add-on
    - 'App 7539 (4.0.10, 4 September 2026) and add-on 7538 (4.0.35, 8 September 2026): Catalyst Center, SD-WAN, ISE (including Security Group Tags and IP-SGT bindings), Cyber Vision, IOS and NetFlow. Campus
      and branch scope: no data-center, Nexus or Isovalent content, and no ISE ANC action. Installed on the stack without the add-on; not used in this demo.'
  - - Cisco DC Networking app
    - 'Splunkbase 7777, 1.2.2 (24 July 2026), Cisco-supported: Nexus 9000, ACI and Nexus Dashboard anomalies, advisories, flows, congestion and endpoints (cisco:dc:nd:anomalies, cisco:dc:nd:advisories).
      Not installed on the stack; this build''s cisco:nexus:* sourcetypes are its own.'
  - - Enterprise Security 8.7 tools in the Splunk MCP Server
    - Read-only es_ tools (es_get_finding and others) register automatically with Splunk MCP Server 1.3 or later; enforcement still goes through SOAR (Enterprise Security 8.7 documentation, September 2026).
  - - dCloud Cisco Secure Networking demo
    - 'Instant demo, shared and read-only: Cloud Control, Meraki, ISE, Security Cloud Control, Secure Access, Secure Firewall, SD-WAN, ThousandEyes, Secure Workload and Splunk Cloud. Two of its use cases
      walk through the Splunk App for Secure Networking (the same beta app). No Isovalent, Nexus Dashboard or Hypershield. Reviewed 24 September 2026; see the demo review.'
  section3_before:
    Deck: Same deck; add screenshots of the Secure Networking view and the posture dashboard to slides 13 and 19 once captured.
    Dashboards: Enable the Splunk Security Content Cisco Isovalent detections with field aliases (pod_name, pod_namespace, pod_image_name) so product detections add risk next to the two protected-path detections.
    Live demo instance: Install the Cisco Security Cloud App (or the dedicated Isovalent add-on once released) and the Cisco DC Networking app, retire the demo app's own Tetragon parsing, and align the
      Nexus sourcetypes with cisco:dc:*.
    Secure Networking Essentials: Install the Cisco DC Networking app and feed Nexus Dashboard data so the fabric cards fill; add a Tetragon alert event so Runtime Detections is not zero.
    Enforcement: The same playbook against a lab Kubernetes cluster (CiliumNetworkPolicy) with an approval gate; an NX-API or Hypershield action as a second step, also through the HTTP app.
    Leave-behinds: Add the lab-phase scope document.
