  notes:
    3: 'Play these back in the customer''s own words, before any product. Zero trust everything: identity, not IP, as the unit of policy, for every workload, VM and service. Creative segmentation: segments
      that follow the workload across the kernel, the NIC and the switch, because firewalls in the east-west path cannot keep up with AI traffic and VLAN-era segmentation cannot express a job or a tenant.
      Routing on the edge: hosts and clusters join the fabric directly and advertise their own routes, so a new site comes up with the same design in days. Pause on the ''where it breaks at AI scale'' lines
      and ask which one hurts most today. The bottom band is the common requirement, and it is a data requirement: see every workload, every flow and every policy decision in one place. That is the Splunk
      role, and the rest of the deck is one incident that shows it.'
    5: 'Set expectations before the demo. Everything on the left is the real Splunk product, running live: the events in the index, the Enterprise Security finding, the Agent Launchpad agent, the SOAR playbook
      with its approval, and the posture dashboard. Everything on the right runs in your environment, not in Splunk, so we explain it rather than demo it: the build farm and CI runner, the checkpoint store,
      Cilium''s identity and audit mode, the Hubble and Tetragon sensors, and the enforcement points. In the demo, a generator plays the role of the cluster: it sends the same Hubble and Tetragon events
      a real cluster sends, with the same field names, and it honours the policy SOAR applies, so the verdict really flips from AUDIT to DROPPED on screen. Slides are tagged the same way: ''Live in Splunk''
      or ''Explained''. One more live screen comes before the incident: Splunk Secure Networking Essentials, the product view of the same Tetragon data, so the audience sees what ships before what we built.'
    6: 'How the pieces connect. Left, getting data in: Hubble flow logs arrive over the HTTP Event Collector; Tetragon events arrive through the Cisco Security Cloud App for Splunk, which lists Cisco Isovalent
      Runtime Security as a supported product and parses process execution and connection events; Nexus switch data comes through Cisco''s data center networking add-on; Live Protect exports switch telemetry
      and syslog from NX-OS, orchestrated through Nexus Dashboard. Splunk Security Content ships Cisco Isovalent detections on the Tetragon data. Middle, the Splunk platform: one index, lookups that add
      the workload owner, the CI job and the server, Enterprise Security for detection, Agent Launchpad for the investigation, SOAR for the response. Right, the enforcement points, each with its approver:
      a Cilium policy on the server needs one approver; a Hypershield rule on a DPU or smart switch, or a Nexus port or route change, touches the network, so SOC and NetOps both approve. The loop closes
      when the next flow from the same workload shows the new verdict.'
    13: 'What ships, and what we build for you. Left, product: Splunk Secure Networking Essentials, in beta, already reads Tetragon runtime data. In the app: Secure Infrastructure, Secure Data Center Operations,
      Runtime Security tab, time range 24h: active Isovalent nodes, observed namespaces, process executions and telemetry age; the Runtime Investigation tab ranks workloads by process executions, and the
      build-farm CI runner is at the top. Splunk Security Content ships ten Cisco Isovalent detections for Enterprise Security, which turns risk on a workload into one finding; Agent Launchpad in the AI
      Toolkit runs the agent with tools published through the Splunk MCP Server; SOAR prompts a named approver and calls the Kubernetes API through its HTTP app. Data comes in through the Cisco add-ons
      for Tetragon and Nexus, and over the HTTP Event Collector for Hubble flows. Right, what we build with you, and it is small: workload owners and CI context, your protected stores and their allowlists,
      two detections on your paths, five evidence searches for the agent, the quarantine playbook, and the posture and timeline views. Then switch to Splunk and show the Secure Networking view for a minute
      before firing the incident. If asked why Runtime Detections reads 0: this lab sends no Tetragon policy alerts; the detections in this story run in Enterprise Security. Say beta; give no availability
      date.'
    14: 'Section two: switch to the live run. Fire the incident from the live generator page (or in Search with | ztdemo action=fire) and follow steps two to five live. Fast cadence: every scheduled search
      runs each minute, so the finding opens two to three minutes after the fire, the brief a minute or two later, and verification twenty to ninety seconds after the approval.'
    15: 'Live. Fire the incident from the live generator page (it shows the events leaving the machine on a timeline), then show the two events in Splunk. Hubble: index=zero_trust sourcetype=cilium:hubble:flow
      verdict=AUDIT src_workload="build-farm/ci-runner". Tetragon: index=zero_trust sourcetype=cisco:isovalent:processConnect process_name=curl. Point at the same pod, the same destination and the same
      second, then at the context Splunk adds: owner platform-build, CI job 88213 from merge request !4417 by contractor-dev-17, server bf-node-03 on dc2-leaf-205 Eth1/12. The events arrive over the HTTP
      Event Collector of the Splunk Cloud stack exactly as production data would.'
    16: 'Live, in Enterprise Security 8.7. Two detections run every minute at fast cadence. The first, on Hubble flows, adds risk 50 to the runner workload for an audit-mode flow into a protected AI data
      store (MITRE ATT&CK T1530). The second, on Tetragon events, adds risk 40 for a program not on the approved list (T1059.004). The finding-based detection opens one finding group when the total reaches
      80 from two detections: risk 90, threat objects ai-train/checkpoint-store and /usr/bin/curl, three drilldowns, and the Run AI Agent action. Show the Analyst Queue, open the finding, walk the risk
      timeline and the drilldowns.'
    17: 'Live, in the AI Toolkit''s Agent Launchpad. The agent ZTFlowInvestigator is started by the Run AI Agent action on the finding-based detection; you can also run it from Search with the aiagent command.
      It only has the five zero trust tools exposed through the Splunk MCP Server on this stack: finding context, flow evidence, process evidence, CI job context, workload and server context. Open Agent
      run history, show the tool calls in order, then the brief: disposition, what happened, why it matters, where, recommendation, follow-up. The same brief is a note on the investigation.'
    18: 'Live, in SOAR (Mode A) or in the app''s Enforcement Approvals page (Mode B). The playbook zt_quarantine_workload starts from the finding through an Enterprise Security automation rule, reads the
      brief, picks the nearest enforcement point, the kernel, builds the CiliumNetworkPolicy zt-quarantine-ci-runner-88213 and asks SOC tier 2. Approve as j.chen in a private window: the pod is labeled
      and the policy created through the Kubernetes API (an emulated endpoint reached through a tunnel, the same call as production), both recorded in the Kubernetes audit log with the approver on the audit
      trail.'
    19: 'Live: open the Zero Trust Fabric Posture dashboard in the app. Coverage of paths into protected stores went from 87.7% before the incident to 86.4% when the runner''s path appeared, and to 87.9%
      after the quarantine; unprotected paths 8 to 9 to 8; workload identities 1,283 to 1,284 because the quarantine label creates a new Cilium identity; enforcement actions 16 to 17. The verdict chart
      shows AUDIT then DROPPED for the runner''s attempts, and the first row of the audit trail is this incident: j.chen (SOC tier 2), verified. Then open the Incident Timeline: the five steps with their
      live timestamps, the journey grid from the one-pager, and every event of the incident.'
    21: 'The ask. Phase one is this conversation: the five steps end to end on our lab data. Phase two is a lab validation in your environment: one cluster with Isovalent, one protected store with its allowlist
      in audit mode, one Nexus leaf pair, your Splunk with Enterprise Security, and one SOAR playbook with an approval gate. Phase three is the first protected store in enforce mode, the posture dashboard
      for its owners, and the detections and playbook in production. Success criteria agreed up front: protected-path coverage, unprotected paths, time from finding to enforced policy, and a complete audit
      trail for every enforcement.'
    22: 'Close. Restate the ask: a lab validation on one cluster, one protected store in audit mode and one Nexus leaf pair, with success criteria agreed up front.'
