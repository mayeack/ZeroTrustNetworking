# Zero trust detections. Every object is exported globally and dispatches in SplunkEnterpriseSecuritySuite.
# The macros zt_since_reset, zt_risk_window, zt_last_reset and zt_not_already_risked come from zt_incident_demo.

[ZT - Audit-Mode Flow Into Protected AI Data Store - Rule]
description = A workload connected to a protected AI data store that the store's allowlist would deny. The allowlist is in audit mode, so the connection went through. Adds risk to the source workload once per path.
search = index=zero_trust sourcetype=cilium:hubble:flow verdict=AUDIT traffic_direction=INGRESS dest_protected=true `zt_since_reset` \
| stats count min(_time) as firstTime max(_time) as lastTime values(src_identity) as src_identity values(dest_identity) as dest_identity values(src_pod) as src_pod values(dest_pod) as dest_pod values(allowlist_policy) as allowlist_policy values(node) as node by src_workload dest_workload dest_port \
| lookup zt_known_gaps src_workload dest_workload dest_port OUTPUT ticket \
| where isnull(ticket) OR ticket="" \
| `zt_not_already_risked("ZT - Audit-Mode Flow Into Protected AI Data Store - Rule", src_workload, dest_workload)` | eval zt_run=`zt_last_reset`
cron_schedule = * * * * *
dispatch.earliest_time = -60m@m
dispatch.latest_time = now
enableSched = 1
disabled = 0
is_scheduled = 1
realtime_schedule = 1
schedule_window = auto
allow_skew = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 0
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.fields = src_workload,dest_workload,zt_run
alert.suppress.period = 60m
action.correlationsearch.enabled = 1
action.correlationsearch.label = ZT - Audit-Mode Flow Into Protected AI Data Store
action.correlationsearch.annotations = {"mitre_attack": ["T1530"], "analytic_story": ["Zero Trust Protected Paths"]}
action.correlationsearch.metadata = {"detection_id": "6f1c1e0e-3a2b-4d1c-9b6e-2f5a7c8d9e01", "deprecated": "0", "detection_version": "1"}
action.risk = 1
action.risk.param._risk = [{"risk_object_field": "src_workload", "risk_object_type": "system", "risk_score": 50}, {"threat_object_field": "dest_workload", "threat_object_type": "workload"}]
action.risk.param._risk_message = $src_workload$ connected to protected store $dest_workload$ on port $dest_port$, which its allowlist would deny (audit mode)
action.risk.param._risk_score = 50
action.notable = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite

[ZT - Unapproved Program Connected to Protected AI Data Store - Rule]
description = A program that is not on the approved list for a protected AI data store opened a connection to it. Adds risk to the source workload once per program and path.
search = index=zero_trust sourcetype=cisco:isovalent:processConnect dest_protected=true `zt_since_reset` \
| lookup zt_process_allowlist src_workload dest_workload process OUTPUT approved \
| where isnull(approved) OR approved="" \
| stats count min(_time) as firstTime max(_time) as lastTime values(src_pod) as src_pod values(node) as node values(parent_process) as parent_process values(process_args) as process_args values(container_image) as container_image by src_workload dest_workload dest_port process process_name \
| `zt_not_already_risked("ZT - Unapproved Program Connected to Protected AI Data Store - Rule", src_workload, process)` | eval zt_run=`zt_last_reset`
cron_schedule = * * * * *
dispatch.earliest_time = -60m@m
dispatch.latest_time = now
enableSched = 1
disabled = 0
is_scheduled = 1
realtime_schedule = 1
schedule_window = auto
allow_skew = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 0
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.fields = src_workload,process,zt_run
alert.suppress.period = 60m
action.correlationsearch.enabled = 1
action.correlationsearch.label = ZT - Unapproved Program Connected to Protected AI Data Store
action.correlationsearch.annotations = {"mitre_attack": ["T1059.004"], "analytic_story": ["Zero Trust Protected Paths"]}
action.correlationsearch.metadata = {"detection_id": "7a2d2f1f-4b3c-4e2d-8c7f-3a6b8d9e0f12", "deprecated": "0", "detection_version": "1"}
action.risk = 1
action.risk.param._risk = [{"risk_object_field": "src_workload", "risk_object_type": "system", "risk_score": 40}, {"threat_object_field": "process", "threat_object_type": "process"}, {"threat_object_field": "dest_workload", "threat_object_type": "workload"}]
action.risk.param._risk_message = $process_name$ ($process$) in $src_workload$ connected to protected store $dest_workload$; not on the approved program list
action.risk.param._risk_score = 40
action.notable = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite

[ZT - Workload Exceeded Risk Threshold on Protected-Path Signals - Rule]
description = A finding-based detection that opens one finding group when a workload reaches risk 80 or more from at least two zero trust detections within 60 minutes: an audit-mode flow into a protected AI data store and an unapproved program connecting to it.
search = | tstats summariesonly=false `common_fbd_fields` from datamodel=Risk.All_Risk where source="ZT - *" [ `zt_risk_window` ] by All_Risk.normalized_risk_object, All_Risk.risk_object_type, index | `drop_dm_object_name("All_Risk")` | `get_mitre_annotations` | `generate_findings_summary_on_entity` | where risk_score >= 80 AND source_count >= 2 | eval zt_run=`zt_last_reset`
cron_schedule = * * * * *
dispatch.earliest_time = -60m@m
dispatch.latest_time = now
dispatch.rt_backfill = 1
enableSched = 1
disabled = 0
is_scheduled = 1
realtime_schedule = 1
schedule_window = auto
allow_skew = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.fields = normalized_risk_object,zt_run
alert.suppress.period = 60m
alert.expires = 24h
alert.severity = 4
action.correlationsearch.command = | noop
action.correlationsearch.detection_type = fbd
action.correlationsearch.enabled = 1
action.correlationsearch.fbd.finding_group_lookback = {"time": "10m", "seconds": 600}
action.correlationsearch.fbd.finding_group_overlap = {"percentage": 10, "time": "1m", "seconds": 60}
action.correlationsearch.fbd.input_type = custom-fbd
action.correlationsearch.fbd.max_append_time = 10m
action.correlationsearch.fbd.reopen_finding_groups = 0
action.correlationsearch.fbd.search_on = ["int-finding", "finding"]
action.correlationsearch.fbd.tokens = {"preview_earliest_time": "-60m@m", "preview_latest_time": "now", "detection_name": "ZT - Workload Exceeded Risk Threshold on Protected-Path Signals - Rule"}
action.correlationsearch.label = ZT - Workload Exceeded Risk Threshold on Protected-Path Signals
action.correlationsearch.annotations = {"analytic_story": ["Zero Trust Protected Paths"]}
action.correlationsearch.metadata = {"detection_id": "8b3e3a2a-5c4d-4f3e-9d8a-4b7c9e0f1a23", "deprecated": "0", "detection_version": "1"}
action.notable = 1
action.notable.param.rule_title = Unprotected path: $risk_object$ reached a protected AI data store
action.notable.param.rule_description = $risk_object$ reached risk $risk_score$ from $source_count$ zero trust detections: an audit-mode flow into a protected AI data store and an unapproved program connecting to it.
action.notable.param.security_domain = network
action.notable.param.severity = high
action.notable.param.investigation_type = default
action.notable.param.next_steps = {"version": 1, "data": "1. Read the ZTFlowInvestigator brief in the notes. 2. Run the playbook zt_quarantine_workload (it may already be running). 3. Approve or reject the quarantine."}
action.notable.param.drilldown_searches = [{"name":"Raw Hubble flows for $risk_object$","search":"index=zero_trust sourcetype=cilium:hubble:flow src_workload=\"$risk_object$\" dest_protected=true","earliest_offset":"3600","latest_offset":"3600"},{"name":"Tetragon events for $risk_object$","search":"index=zero_trust sourcetype=cisco:isovalent:* src_workload=\"$risk_object$\"","earliest_offset":"3600","latest_offset":"3600"},{"name":"CI jobs on $risk_object$ pods","search":"index=zero_trust sourcetype=ci:job:event [search index=zero_trust sourcetype=cisco:isovalent:processConnect src_workload=\"$risk_object$\" dest_protected=true | stats count by src_pod | rename src_pod as pod | fields pod]","earliest_offset":"3600","latest_offset":"3600"}]
action.notable.param.drilldown_earliest_offset = $info_min_time$
action.notable.param.drilldown_latest_offset = $info_max_time$
action.notable.param.extract_artifacts = {"asset": ["src", "dest", "dvc", "orig_host"], "identity": ["src_user", "user"]}
action.risk = 0
action.risk.param._risk = []
action.run_aiagent = 1
action.run_aiagent.param.agent_name = ZTFlowInvestigator
action.run_aiagent.param.prompt = Investigate the newest zero trust finding group and return the brief.
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
